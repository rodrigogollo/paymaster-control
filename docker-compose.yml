services:
  client:
    build: ./client
    ports:
      - "3001:3001"
    volumes:
      - ./client:/src
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/src
    environment:
      DATABASE_URL: postgresql://paymaster:paymaster@db:5432/paymaster
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paymaster
      POSTGRES_PASSWORD: paymaster
      POSTGRES_DB: paymaster
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymaster -d paymaster"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
