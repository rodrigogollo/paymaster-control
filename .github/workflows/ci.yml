name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Run tests
        run: npm run test
        working-directory: client

  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paymaster
          POSTGRES_PASSWORD: paymaster
          POSTGRES_DB: paymaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymaster -d paymaster"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run migrations
        run: npm run db:migrate
        working-directory: server
        env:
          DATABASE_URL: postgresql://paymaster:paymaster@localhost:5432/paymaster
          NODE_ENV: test
          APP_STAGE: test
          JWT_SECRET: my_super_secret_jwt_key_here_lol_test
          JWT_EXPIRES_IN: "28800000"
          GOOGLE_CLIENT_ID: google_client_test
          GOOGLE_CLIENT_SECRET: google_secret_test
          COOKIE_KEY_1: secretkey_paymaster_test
          COOKIE_KEY_2: secretkeyforrotation_paymaster_test
      - name: Run tests
        run: npm run test
        working-directory: server
        env:
          DATABASE_URL: postgresql://paymaster:paymaster@localhost:5432/paymaster
          NODE_ENV: test
          APP_STAGE: test
          JWT_SECRET: my_super_secret_jwt_key_here_lol_test
          JWT_EXPIRES_IN: "28800000"
          GOOGLE_CLIENT_ID: google_client_test
          GOOGLE_CLIENT_SECRET: google_secret_test
          COOKIE_KEY_1: secretkey_paymaster_test
          COOKIE_KEY_2: secretkeyforrotation_paymaster_test

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-client, test-server]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - run: echo "Would deploy image to dev server here"
